<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<title>Impressum | DoPeCh Commerce</title>
<style>
:root{
  --navy:#040a13;--navy2:#081426;--navy3:#0d2039;
  --gold:#c9932f;--gold2:#f0c968;--gold3:#fff0ad;
  --text:#f7f3e8;--muted:#b8c1cd;--line:rgba(240,201,104,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;overflow-x:hidden;
  font-family:Arial,Helvetica,sans-serif;color:var(--text);
  background:
    radial-gradient(circle at 50% -10%,rgba(240,201,104,.15),transparent 28%),
    radial-gradient(circle at 8% 35%,rgba(44,87,140,.20),transparent 25%),
    radial-gradient(circle at 92% 68%,rgba(190,125,28,.12),transparent 22%),
    linear-gradient(145deg,var(--navy3),var(--navy2) 46%,var(--navy));
}
body:before,body:after{
  content:"";position:fixed;width:420px;height:420px;border-radius:50%;
  filter:blur(70px);opacity:.18;z-index:-1;animation:floatOrb 14s ease-in-out infinite;
}
body:before{background:#b57f23;left:-120px;top:10vh}
body:after{background:#173f70;right:-120px;bottom:4vh;animation-delay:-7s}
@keyframes floatOrb{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(35px,-28px,0) scale(1.08)}}
.page{min-height:100vh;display:flex;flex-direction:column}
.hero{flex:1;display:flex;align-items:center;justify-content:center;padding:54px 20px 36px;text-align:center}
.card{
  position:relative;width:min(920px,100%);overflow:hidden;padding:58px 32px 44px;
  border:1px solid rgba(240,201,104,.22);border-radius:30px;
  background:linear-gradient(180deg,rgba(13,28,49,.78),rgba(4,10,19,.70));
  box-shadow:0 30px 100px rgba(0,0,0,.50),inset 0 1px 0 rgba(255,255,255,.04);
}
.card:before{
  content:"";position:absolute;inset:-2px;
  background:linear-gradient(120deg,transparent 0 35%,rgba(255,231,159,.09) 48%,transparent 61%);
  transform:translateX(-120%);animation:sweep 7s ease-in-out infinite;pointer-events:none;
}
@keyframes sweep{0%,35%{transform:translateX(-120%)}70%,100%{transform:translateX(120%)}}
.logo-img{
  width:min(680px,96%);
  height:auto;
  display:block;
  margin:0 auto 12px;
  border-radius:10px;
  box-shadow:0 18px 50px rgba(0,0,0,.18);
}
.diamond{width:12px;height:12px;margin:20px auto 28px;background:linear-gradient(135deg,var(--gold3),var(--gold));transform:rotate(45deg);box-shadow:0 0 24px rgba(240,201,104,.26)}
h1{margin:0;font-size:clamp(34px,5vw,56px);line-height:1.08;letter-spacing:.02em;font-weight:800}
.lead{margin:18px auto 0;max-width:640px;color:var(--muted);font-size:clamp(17px,2.2vw,21px);line-height:1.65}
.status{display:inline-flex;align-items:center;gap:10px;margin-top:30px;padding:12px 18px;border:1px solid rgba(240,201,104,.48);border-radius:999px;color:var(--gold3);background:rgba(240,201,104,.045);font-size:13px;letter-spacing:.10em;text-transform:uppercase}
.status:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold2);box-shadow:0 0 14px rgba(240,201,104,.85);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
.contact{margin-top:32px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;border-radius:14px;padding:14px 22px;font-weight:700;transition:.2s ease}
.btn:hover{transform:translateY(-2px)}
.btn-primary{color:#111820;background:linear-gradient(135deg,var(--gold3),var(--gold2) 45%,var(--gold));box-shadow:0 10px 30px rgba(213,161,61,.20)}
.btn-secondary{color:var(--text);border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.035)}
.footer{text-align:center;padding:0 20px 30px;color:#7f8b99;font-size:13px}
.footer a{color:#cbd2db;text-decoration:none}.footer a:hover{text-decoration:underline}
.legal{width:min(760px,100%);margin:60px auto;padding:36px 30px;border:1px solid rgba(240,201,104,.18);border-radius:24px;background:linear-gradient(180deg,rgba(13,28,49,.78),rgba(4,10,19,.76));box-shadow:0 30px 90px rgba(0,0,0,.42)}
.legal-logo{width:min(520px,100%);display:block;margin:0 auto 26px;border-radius:8px}
.legal h1{font-size:clamp(34px,5vw,50px);color:var(--gold2);margin-bottom:28px}
.legal h2{font-size:18px;color:var(--gold2);margin:26px 0 10px}
.legal p{color:#d8dde3;line-height:1.7;margin:0 0 14px}
.legal a{color:var(--gold3)}
.back{margin-top:26px}
@media(max-width:560px){
  .hero{padding-top:28px}.card{padding:38px 18px 30px;border-radius:22px}
  .contact{flex-direction:column}.btn{width:100%}
  .legal{margin:28px auto;padding:28px 20px;border-radius:20px}
}
</style>
</head>
